<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" role="img" aria-labelledby="title desc">
  <title id="title">Animated exercise demonstration placeholder</title>
  <desc id="desc">An original hand-drawn athlete pressing a barbell.</desc>
  <style>
    .ink{fill:none;stroke:#1a1c18;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
    .thin{fill:none;stroke:#1a1c18;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .lift{transform-origin:260px 174px;animation:press 2.4s ease-in-out infinite}
    .spark{transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
    @keyframes press{0%,100%{transform:translateY(28px)}50%{transform:translateY(-18px)}}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8) rotate(-5deg)}50%{opacity:1;transform:scale(1.08) rotate(5deg)}}
    @media (prefers-reduced-motion:reduce){.lift,.spark{animation:none}}
  </style>
  <rect width="520" height="390" rx="42" fill="#ece8dd"/>
  <path d="M38 320c104 13 252 12 444-3M72 340c113 8 226 7 340-2" class="thin" opacity=".22" stroke-dasharray="10 14"/>
  <path d="M118 292h286M146 292l-18 34M377 292l17 34" class="ink"/>
  <circle cx="260" cy="224" r="25" fill="#c9f43d" stroke="#1a1c18" stroke-width="7"/>
  <path d="M237 247l-44 39M283 247l44 39M239 251l-21 37M281 251l21 37" class="ink"/>
  <g class="lift">
    <path d="M170 163h180M150 136v54M171 142v42M350 142v42M371 136v54" class="ink"/>
    <path d="M224 178l-7 49M296 178l7 49M224 179l-54-16M296 179l54-16" class="ink"/>
  </g>
  <path d="M235 228c15 8 33 8 50 0" class="thin"/>
  <g class="spark">
    <path d="M413 77l8 20 21 7-21 8-8 21-8-21-21-8 21-7z" fill="#c9f43d" stroke="#1a1c18" stroke-width="4"/>
    <path d="M102 91l4 11 12 4-12 4-4 12-5-12-11-4 11-4z" fill="#efc955" stroke="#1a1c18" stroke-width="3"/>
  </g>
  <path d="M51 200c27-19 49-28 68-27M45 218c26-9 48-12 66-8M401 207c21 7 40 18 57 34" class="thin" opacity=".5"/>
  <text x="260" y="367" fill="#6f716a" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">ORIGINAL DEMO PLACEHOLDER</text>
</svg>
